name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

  state-primitives:
    name: state primitives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lemma/core build
      - run: pnpm --filter @lemma/core test -- state
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned assay oracle
        id: oracle
        run: |
          echo "commit=$(node -p \"require('./docs/parity/oracle.json').assay_commit\")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hbahuguna/assay
          ref: ${{ steps.oracle.outputs.commit }}
          path: _assay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm parity:check
      - name: Link pinned assay oracle
        run: ln -s "$GITHUB_WORKSPACE/_assay" ../assay
      - run: pnpm test:parity
      - run: pnpm test
