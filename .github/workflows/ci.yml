name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  parity:
    name: parity (ubuntu-latest, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned assay oracle
        id: oracle
        shell: bash
        run: |
          echo "commit=$(node -p \"require('./docs/parity/oracle.json').assay_commit\")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hbahuguna/assay
          ref: ${{ steps.oracle.outputs.commit }}
          path: _assay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Parity manifest check
        run: pnpm parity:check
      - name: Link pinned assay oracle
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/_assay" ../assay
      - name: Parity tests
        run: pnpm test:parity
